apply plugin: 'com.android.application'

// The APK's version comes from package.json, the same file the desktop installers and the IPA read,
// so a phone build can never claim a version the app inside it does not carry. Android will not
// install an update whose versionCode is not higher than the installed one, so the code is derived
// monotonically from the semver: 0.7.3 -> 703, 0.8.0 -> 800.
def pkgJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def semver = (pkgJson.version =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!semver.find()) {
    throw new GradleException("package.json version is not semver: ${pkgJson.version}")
}
def appVersionName = pkgJson.version
def appVersionCode = (semver.group(1) as int) * 10000 + (semver.group(2) as int) * 100 + (semver.group(3) as int)

// Signing: the keystore lives outside the repo. Locally it comes from android/keystore.properties
// (git-ignored); in CI from environment variables decoded out of repository secrets. No literals
// here, and no keystore in the tree — the key is the app's identity and must not be published.
def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}
def ksPath = System.getenv('ANDROID_KEYSTORE_PATH') ?: ksProps.getProperty('storeFile')
def ksStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ksProps.getProperty('storePassword')
def ksAlias = System.getenv('ANDROID_KEYSTORE_ALIAS') ?: ksProps.getProperty('keyAlias')
def ksKeyPassword = System.getenv('ANDROID_KEYSTORE_KEY_PASSWORD') ?: ksStorePassword

android {
    namespace "ing.hardlysleep.hardlytracking"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ing.hardlysleep.hardlytracking"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }
    // jsoup (multi-release) and the extension API both ship
    // `META-INF/versions/9/OSGI-INF/MANIFEST.MF`; two copies of one path is a hard error for the
    // resource merger, and neither copy is read at runtime.
    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Without a keystore this stays unsigned: the build still runs (a smoke build on a
            // machine with no key), and `apksigner verify` is what proves a shipped APK was signed.
            if (ksPath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    // The Mihon/Tachiyomi extension API the APKs are compiled against. Keiyoushi publishes it on
    // JitPack, which is also how their own extensions build; an extension's classes cannot be loaded
    // without these interfaces on our classpath.
    maven { url 'https://jitpack.io' }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ---- the on-device extension host (Android) ------------------------------------------------
    // Android already runs extension APKs natively: ART loads the dex, no emulation needed (this is
    // why the iPhone needs an embedded JVM and this shell does not). What an extension does *not*
    // carry is its dependencies — the API interfaces it implements and the http/html stack it calls.
    // Those are compileOnly for an extension and must exist in the host app, exactly as they do in
    // Mihon/Komikku.
    // A build of the API that compiles against SDK 36, not the newest (`42255ee5fa` wants 37, and
    // AGP 8.7.2 tops out at 36). The interfaces are the same; move up when AGP moves up.
    implementation 'com.github.keiyoushi:extensions-lib:c65161992c'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.4.0'
    implementation 'org.jsoup:jsoup:1.22.2'
    // The folder picker walks an ACTION_OPEN_DOCUMENT_TREE with DocumentFile.
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'io.reactivex:rxjava:1.3.8'
    // injekt comes in with extensions-lib (com.github.mihonapp:injekt). A second copy is a
    // duplicate class and an InjektModule registry that disagrees with the extension's.
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
