# HardlyTracking — one origin for the app and both extension hosts.
#
#   docker compose up -d
#   open http://<host>:8460
#
# `web` serves the built Svelte app and proxies /api/mihon/* to `runtime` and /api/dalvik to
# `dalvik`. `runtime` is Suwayomi (a library server); `dalvik` is M-Extension-Server, which runs
# Mihon/Komikku APKs themselves. The app's library and read state are its own — these hosts are
# execution engines, never the source of truth.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server/proxy.mjs"]
    environment:
      PORT: "8460"
      RUNTIME_URL: "http://runtime:4567"
      DALVIK_URL: "http://dalvik:8080"
    volumes:
      - ./dist:/app/dist:ro
      - ./server:/app/server:ro
    ports:
      - "8460:8460"
    depends_on:
      - runtime
      - dalvik
    restart: unless-stopped

  runtime:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    environment:
      - TZ=America/Los_Angeles
      # The JVM sizes max heap at 25% of the HOST without this; a download queue
      # then fills it and the server sits in permanent GC.
      - JAVA_TOOL_OPTIONS=-Xmx2g
    volumes:
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    cpus: 2
    restart: unless-stopped

  # M-Extension-Server: the real Mihon extension host. Build it once from its source —
  #   git clone https://github.com/kodjodevf/M-Extension-Server ../M-Extension-Server
  #   docker build -t mextension-server:local ../M-Extension-Server
  # The image carries a JRE and the Android SDK stubs the APKs link against, so it is the only
  # piece of this stack that can execute a Mihon extension at all.
  dalvik:
    image: mextension-server:local
    environment:
      - TZ=America/Los_Angeles
    # One core: an extension host is a burst of work per page request, and an unbounded JVM here
    # competes with the reader on the same machine.
    cpus: 1.0
    ports:
      - "8792:8080"
    restart: unless-stopped

volumes:
  suwayomi-data:
