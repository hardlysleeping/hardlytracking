name: desktop

# The PC build, on all three platforms, with the extension host inside it.
#
# A Windows `.exe` cannot be produced on the Linux workstation and a macOS `.dmg` cannot be produced
# anywhere but a Mac, so the runners are the only place these exist. Each job downloads the pinned
# M-Extension-Server bundle for its platform (`scripts/prepare-runtime.mjs`) — that is the jar and a
# JRE — builds, and checks the packaged app actually carries them before anything is uploaded.
#
# On a `v*` tag the installers go onto the release. On a manual run they are artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundles: deb
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis,msi
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Linux webview is WebKitGTK, and Tauri's own prerequisites are not on the runner image.
      # `libfuse2` is for `linuxdeploy`, which the AppImage bundler runs and which fails without it.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The jar and the JRE, pinned by version and checked by SHA-256. Before the Rust build, because
      # `tauri.conf.json` lists them as bundle resources and the build fails without them.
      - name: Prepare the extension host
        run: node scripts/prepare-runtime.mjs --platform=${{ matrix.platform }}

      - run: npm run build

      - name: Build the bundles
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # linuxdeploy is the fragile part of a Linux bundle: it is itself an AppImage, it strips every
      # ELF it finds (the extension host's JRE is 60 MB of them), and it reports one sentence whatever
      # went wrong. It must not be able to fail the release, because the `.deb` and the tarball below
      # are complete installs on their own.
      - name: AppImage (best effort)
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: npx tauri build --target ${{ matrix.target }} --bundles appimage

      # A `.deb` is no use on Fedora, Arch or an immutable distro, and the AppImage is the one file
      # that runs anywhere. This tarball is the third option and the simplest: the binary and the
      # runtime folder it expects beside it, nothing to install.
      - name: A portable Linux build
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          release="src-tauri/target/${{ matrix.target }}/release"
          version=$(node -p "require('./package.json').version")
          stage="portable/HardlyTracking"
          mkdir -p "$stage"
          cp "$release/hardlytracking" "$stage/"
          cp -r "$release/runtime" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          tar -C portable -czf "HardlyTracking_${version}_linux-x86_64.tar.gz" HardlyTracking
          ls -lh "HardlyTracking_${version}_linux-x86_64.tar.gz"
          # The same two files the installer is checked for, in the tarball. One listing, then grep
          # the file: `tar | grep -q` fails under `pipefail` because grep exits at the first match and
          # tar dies of SIGPIPE, which reads as "the tarball is wrong".
          tar -tzf "HardlyTracking_${version}_linux-x86_64.tar.gz" > /tmp/tarball-list.txt
          grep -q 'HardlyTracking/runtime/runner.jar' /tmp/tarball-list.txt
          grep -q 'HardlyTracking/runtime/jre/bin/java' /tmp/tarball-list.txt
          echo "✓ the tarball carries runner.jar and a JRE"

      # A bundle that compiles but carries no JVM opens a window with no extension host, and the user
      # cannot tell that from a broken source. Check the packaged output, not the build tree.
      - name: The bundle carries the host (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          deb=$(find "$out/deb" -name '*.deb' -print -quit)
          [ -n "$deb" ] || { echo "✗ no .deb"; exit 1; }
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - > /tmp/deb-list.txt
          grep -q 'runtime/runner\.jar' /tmp/deb-list.txt || { echo "✗ no runner.jar in $deb"; exit 1; }
          grep -q 'runtime/jre/bin/java$' /tmp/deb-list.txt || { echo "✗ no JRE in $deb"; exit 1; }
          echo "✓ $deb carries runner.jar and a JRE"

          appimage=$(find "$out/appimage" -name '*.AppImage' -print -quit)
          if [ -n "$appimage" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
            find squashfs-root -path '*runtime/runner.jar' -print -quit | grep -q . || { echo "✗ no runner.jar in the AppImage"; exit 1; }
            find squashfs-root -path '*runtime/jre/bin/java' -print -quit | grep -q . || { echo "✗ no JRE in the AppImage"; exit 1; }
            echo "✓ $appimage carries runner.jar and a JRE"
          else
            echo "• no AppImage this run (linuxdeploy); the .deb and the tarball are the Linux installs"
          fi

      - name: The bundle carries the host (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          app=$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -name '*.app' -maxdepth 3 -print -quit)
          [ -n "$app" ] || { echo "✗ no .app"; exit 1; }
          [ -f "$app/Contents/Resources/runtime/runner.jar" ] || { echo "✗ no runner.jar in $app"; exit 1; }
          [ -x "$app/Contents/Resources/runtime/jre/bin/java" ] || { echo "✗ no executable JRE in $app"; exit 1; }
          "$app/Contents/Resources/runtime/jre/bin/java" -version
          echo "✓ $app carries runner.jar and a working JRE"

      # A `.dmg` is how a Mac app is normally handed over, but it needs mounting, and unsigned it
      # needs Gatekeeper talked round either way. A zipped `.app` is the plain alternative, and
      # `ditto` is the one tool that preserves the symlinks and permissions a bundle depends on.
      - name: A portable macOS build
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          app=$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -name '*.app' -maxdepth 3 -print -quit)
          [ -n "$app" ] || { echo "✗ no .app"; exit 1; }
          version=$(node -p "require('./package.json').version")
          zip="HardlyTracking_${version}_${{ matrix.name }}-portable.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          ls -lh "$zip"
          unzip -l "$zip" > /tmp/zip-list.txt
          grep -q 'runtime/runner.jar' /tmp/zip-list.txt
          grep -q 'runtime/jre/bin/java' /tmp/zip-list.txt
          echo "✓ $zip carries runner.jar and a JRE"

      - name: The bundle carries the host (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          release="src-tauri/target/${{ matrix.target }}/release"
          # Tauri copies bundle resources beside the executable before the installer is built, so this
          # tree is what ends up inside the .exe.
          [ -f "$release/runtime/runner.jar" ] || { echo "::error::no runtime/runner.jar beside the exe"; exit 1; }
          [ -f "$release/runtime/jre/bin/java.exe" ] || { echo "::error::no runtime/jre/bin/java.exe beside the exe"; exit 1; }
          "$release/runtime/jre/bin/java.exe" -version
          ls -la "$release"/bundle/nsis/*.exe "$release"/bundle/msi/*.msi
          echo "✓ the installer is built from a tree that carries the host"

      # An installer is not always what someone wants: it writes to Program Files, adds an entry to
      # Add/Remove Programs and needs an uninstaller. A portable folder is the whole app in one
      # directory — unzip, run `HardlyTracking.exe`, delete the folder to remove it. Same tree the
      # installer is built from, so the runtime sits beside the executable exactly where
      # `src-tauri/src/runtime.rs` looks for it.
      - name: A portable Windows build
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          release="src-tauri/target/${{ matrix.target }}/release"
          version=$(node -p "require('./package.json').version")
          stage="portable/HardlyTracking"
          mkdir -p "$stage"
          cp "$release/hardlytracking.exe" "$stage/"
          cp -r "$release/runtime" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          zip="HardlyTracking_${version}_windows-x86_64-portable.zip"
          # 7-Zip is installed on the Windows image but not on PATH, so ask for it by path and keep a
          # PATH lookup first in case a future image adds it. Compress-Archive takes minutes on 140 MB.
          sevenz=$(command -v 7z || true)
          [ -n "$sevenz" ] || sevenz="/c/Program Files/7-Zip/7z.exe"
          [ -x "$sevenz" ] || { echo "::error::no 7-Zip at $sevenz"; exit 1; }
          "$sevenz" a -tzip -mx=5 "$zip" portable/HardlyTracking > /dev/null
          ls -lh "$zip"
          # Prove the archive carries the host, rather than trusting the folder it came from. 7-Zip
          # lists Windows paths with backslashes, so normalise before grepping — a grep for
          # `runtime/runner.jar` misses `HardlyTracking\runtime\runner.jar` and fails a good zip.
          "$sevenz" l "$zip" | tr '\\' '/' > /tmp/zip-list.txt
          grep -q 'runtime/runner.jar' /tmp/zip-list.txt
          grep -q 'runtime/jre/bin/java.exe' /tmp/zip-list.txt
          echo "✓ the portable zip carries runner.jar and a JRE"

      - uses: actions/upload-artifact@v4
        with:
          name: hardlytracking-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            HardlyTracking_*_linux-x86_64.tar.gz
            HardlyTracking_*_windows-x86_64-portable.zip
            HardlyTracking_*_macos-*-portable.zip

  # Intel Macs get their own job, outside the matrix, because they are a cross-build and must never be
  # able to fail the release: `continue-on-error` keeps the release green while this one works or
  # does not. It used to run on `macos-13`, the scarcest runner on GitHub — a job that sat queued for
  # over an hour and made every run look unfinished, including the ones that had already published.
  # Apple-silicon runners cross-compile the x86_64 target happily, so the queue is gone; the JRE is
  # the only thing that cannot be guessed, and `--platform=macos-x64` says which one to carry.
  intel:
    name: macos-x86_64
    runs-on: macos-latest
    continue-on-error: true
    # It creates the release page itself when it gets there first, which needs write access — without
    # this the job built a good dmg and then died with `HTTP 403: Resource not accessible by
    # integration` followed by `release not found`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: node scripts/prepare-runtime.mjs --platform=macos-x64
      - run: npm run build
      - run: npx tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: The bundle carries the host
        run: |
          set -euo pipefail
          app="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/HardlyTracking.app"
          [ -f "$app/Contents/Resources/runtime/runner.jar" ] || { echo "✗ no runner.jar"; exit 1; }
          [ -x "$app/Contents/Resources/runtime/jre/bin/java" ] || { echo "✗ no JRE"; exit 1; }
          # The JRE must be Intel, not the runner's own: `file` is the only thing that says so.
          file "$app/Contents/Resources/runtime/jre/bin/java" | tee /tmp/jre-arch.txt
          grep -q 'x86_64' /tmp/jre-arch.txt || { echo "✗ the JRE in the Intel app is not x86_64"; exit 1; }
          "$app/Contents/Resources/runtime/jre/bin/java" -version

      - name: A portable Intel build
        run: |
          set -euo pipefail
          app="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/HardlyTracking.app"
          version=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent "$app" "HardlyTracking_${version}_macos-x86_64-portable.zip"
          ls -lh HardlyTracking_*_macos-x86_64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hardlytracking-macos-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            HardlyTracking_*_macos-x86_64-portable.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dmg=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [ -n "$dmg" ] || { echo "✗ no dmg"; exit 1; }
          cp "$dmg" "HardlyTracking_${version}_macos-x86_64.dmg"
          # This job runs beside the matrix, so the release page may not exist yet — the first
          # attempt failed here with "release not found" after a good build. Create it if it is
          # missing (the release job's own create is idempotent and tolerates this).
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "HardlyTracking ${version}" --generate-notes || true
          fi
          gh release upload "$TAG" "HardlyTracking_${version}_macos-x86_64.dmg" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "HardlyTracking_${version}_macos-x86_64-portable.zip" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Named by hand rather than by the bundler, so the release page reads the same for every
      # platform: HardlyTracking_<version>_<platform>.<ext>. Artifacts keep their bundler's folder
      # (`nsis/`, `msi/`, `dmg/`), so this walks the tree instead of assuming a flat one — the first
      # attempt uploaded the Linux tarball and nothing else, because `*.exe` was one directory down.
      - name: Collect and rename
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          while IFS= read -r file; do
            base=$(basename "$file")
            # Only the two names this workflow writes itself skip the rename: the portable archives and
            # the Linux tarball. Everything else that starts with `HardlyTracking_` came from a
            # bundler — NSIS names its output `HardlyTracking_<v>_x64-setup.exe` — and matching that
            # prefix too published `x64-setup.exe` and `aarch64.dmg` instead of `windows-x86_64.exe`
            # and `macos-arm64.dmg`.
            case "$base" in
              *-portable.zip|*_linux-x86_64.tar.gz)
                cp "$file" "out/$base"
                continue
                ;;
            esac
            case "$base" in
              *arm64*|*aarch64*) platform=macos-arm64 ;;
              *.dmg)             platform=macos-x86_64 ;;
              *.exe|*.msi)       platform=windows-x86_64 ;;
              *.AppImage|*.deb)  platform=linux-x86_64 ;;
              *.tar.gz)          platform=linux-x86_64-portable ;;
              *) continue ;;
            esac
            case "$base" in
              *.tar.gz) ext=tar.gz ;;
              *)        ext="${base##*.}" ;;
            esac
            cp "$file" "out/HardlyTracking_${version}_${platform}.${ext}"
          done < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*portable.zip' \))
          ls -la out
          test -n "$(ls -A out)" || { echo "✗ nothing to publish"; exit 1; }

      # A tag is pushed before the artifacts exist, so the release is created here rather than being
      # assumed. Never a draft: a release nobody published is a release nobody downloaded.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd out
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "HardlyTracking ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" HardlyTracking_* --clobber --repo "$GITHUB_REPOSITORY"
