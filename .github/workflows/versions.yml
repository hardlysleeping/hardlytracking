name: versions

# One number in four files, checked on the change that introduces drift rather than at the tag.
#
# Three releases went out with package.json at 0.7.11 while the bundle and the binary said 0.7.8,
# and nothing failed because nothing looked: the desktop job names its artefacts from package.json
# and stamps the bundle from tauri.conf.json, so both are "right" and the release is wrong.
on:
  push:
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - scripts/check-versions.mjs
      - .github/workflows/versions.yml
  pull_request:
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
  workflow_dispatch:

jobs:
  agree:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-versions.mjs