name: iOS IPA (unsigned)

# The IPA is built on a macOS runner because an iOS binary needs Xcode, which does not exist on the
# Linux workstation. The artefact is deliberately UNSIGNED: Sideloadly, AltStore or Xcode re-sign it
# with the owner's own Apple ID, which is the only signing identity this project should ever use.
#
# Manual run only — it costs macOS minutes, so it is never triggered by a push.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: master

jobs:
  ipa:
    runs-on: macos-15
    # The first run compiles an OpenJDK Zero static library into a framework (prepare_command); later
    # runs hit the runner's cache only if the image provides one, so budget for the slow path.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK for the runtime's logging shim
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the build into the iOS shell
        run: npx cap sync ios

      - name: The plugin is registered, not just compiled
        run: |
          set -euo pipefail
          # `cap sync` builds packageClassList by scanning the iOS source of every package in
          # package.json. A plugin that is not in it compiles into the app and is never registered,
          # which presents as "the runtime does not start" with nothing in the log.
          node -e "
            const config = require('./ios/App/App/capacitor.config.json');
            const list = config.packageClassList || [];
            if (!list.includes('MihonRuntimePlugin')) {
              console.error('MihonRuntimePlugin is missing from packageClassList:', list.join(', '));
              process.exit(1);
            }
            console.log('registered plugins:', list.join(', '));
          "

      - name: Install pods (downloads and links the embedded JVM)
        working-directory: ios/App
        run: pod install --repo-update

      - name: The toolchain is the current one
        run: |
          set -euo pipefail
          # "Archive on the current SDK" is a moving target, so use the newest Xcode the image
          # carries rather than whatever is selected by default — a pinned old Xcode is how an app
          # ends up rejected for being built against a retired SDK. Betas are skipped: they can be
          # on the image and they cannot be used for a submission.
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v -i -e beta -e 'rc[0-9]' | sort -V | tail -1)
          if [ -n "${NEWEST:-}" ]; then
            echo "selecting $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "iphoneos SDK: ${SDK:-none}"
          FLOOR=18.0
          if [ -z "$SDK" ] || [ "$(printf '%s\n%s\n' "$FLOOR" "$SDK" | sort -V | head -1)" != "$FLOOR" ]; then
            echo "::error::the iphoneos SDK is ${SDK:-missing}, older than the $FLOOR floor App Store submissions require"
            exit 1
          fi

      - name: Archive without signing
        # The bundle's version comes from package.json, not from a second place someone has to
        # remember. Info.plist substitutes MARKETING_VERSION/CURRENT_PROJECT_VERSION into
        # CFBundleShortVersionString/CFBundleVersion, so whatever those settings say is what the app
        # installs as — and the pbxproj said 1.0 on an app whose version is 0.5.1. Passing them here
        # also means a version bump never needs a pbxproj edit.
        run: |
          set -euo pipefail
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER
          echo "bundle version: $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            archive

      - name: The runtime is inside the app, not just linked
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          # A framework that is on disk but not embedded, or a jar that no resource bundle copied,
          # produces an app that starts and then cannot open a single source. Check the bytes.
          test -f "$APP/Frameworks/OpenJDKRuntime.framework/OpenJDKRuntime"
          test -f "$APP/Frameworks/OpenJDKRuntime.framework/lib/lib/modules"
          JAR=$(find "$APP" -name 'MExtensionServer.jar' -print -quit)
          test -n "$JAR"
          test -f "$(dirname "$JAR")/java-logging-shim.jar"
          file "$APP/Frameworks/OpenJDKRuntime.framework/OpenJDKRuntime"
          du -sh "$APP/Frameworks/OpenJDKRuntime.framework" "$(dirname "$JAR")"
          echo "runtime jar: $JAR"

      - name: The bundle is stamped with the app's version
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          WANT=$(node -p "require('./package.json').version")
          GOT=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          echo "CFBundleShortVersionString: $GOT (package.json: $WANT), CFBundleVersion: $BUILD"
          # The built bundle said 1.0 on an app that was 0.5.1, because MARKETING_VERSION was left to
          # Xcode's default. A version that is wrong is a version nobody can report, so this fails
          # loudly rather than shipping a build that misnames itself.
          test "$GOT" = "$WANT"
          case "$BUILD" in ''|*[!0-9]*) echo "::error::CFBundleVersion is not an integer: $BUILD"; exit 1;; esac

      - name: The archive carries the release manifest and the new minimum
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          # docs/app-store-release-checklist.md §8. Read from the built bundle, not from the source
          # tree: a file that is in the group but not in the app target's Resources phase is the
          # mistake this step exists to catch.
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test "$(plutil -extract NSPrivacyTracking raw "$APP/PrivacyInfo.xcprivacy")" = "false"
          # At least one required-reason category, each with a reason — an empty array is the
          # "manifest exists and says nothing" shape that still fails upload.
          plutil -extract NSPrivacyAccessedAPITypes xml1 -o - "$APP/PrivacyInfo.xcprivacy" | grep -q "NSPrivacyAccessedAPICategory"
          plutil -extract NSPrivacyAccessedAPITypes xml1 -o - "$APP/PrivacyInfo.xcprivacy" | grep -q "NSPrivacyAccessedAPITypeReasons"
          MIN=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          echo "MinimumOSVersion: $MIN"
          test "$MIN" = "15.0"
          # Export compliance and local network, read from the built bundle. Both are keys whose
          # absence only shows up on the App Store Connect side (a blocked TestFlight build) or as a
          # LAN request iOS silently drops, so the build is where they get proved.
          ENC=$(plutil -extract ITSAppUsesNonExemptEncryption raw "$APP/Info.plist") || ENC=missing
          echo "ITSAppUsesNonExemptEncryption: $ENC"
          test "$ENC" = "false"
          LAN=$(plutil -extract NSLocalNetworkUsageDescription raw "$APP/Info.plist") || LAN=missing
          echo "NSLocalNetworkUsageDescription: $LAN"
          case "$LAN" in missing|"") echo "::error::NSLocalNetworkUsageDescription is missing from the built bundle"; exit 1;; esac
          # Neither the unused background mode nor the stale armv7 capability may come back.
          if plutil -extract UIBackgroundModes xml1 -o - "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::UIBackgroundModes is back in the built Info.plist"
            exit 1
          fi
          if plutil -extract UIRequiredDeviceCapabilities xml1 -o - "$APP/Info.plist" 2>/dev/null | grep -q armv7; then
            echo "::error::the built Info.plist requires armv7 again"
            exit 1
          fi

      - name: Pack the IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # A payload-only zip is what an IPA is; no signature means any sideloading tool can sign it.
          cd "$RUNNER_TEMP"
          zip -qry HardlyTracking-unsigned.ipa Payload
          ls -lh HardlyTracking-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HardlyTracking-unsigned-ipa
          path: ${{ runner.temp }}/HardlyTracking-unsigned.ipa
          if-no-files-found: error
