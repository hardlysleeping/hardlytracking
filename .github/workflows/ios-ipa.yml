name: iOS IPA (unsigned)

# The IPA is built on a macOS runner because an iOS binary needs Xcode, which does not exist on the
# Linux workstation. The artefact is deliberately UNSIGNED: Sideloadly, AltStore or Xcode re-sign it
# with the owner's own Apple ID, which is the only signing identity this project should ever use.
#
# Manual run only — it costs macOS minutes, so it is never triggered by a push.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: master

jobs:
  ipa:
    runs-on: macos-15
    # The first run compiles an OpenJDK Zero static library into a framework (prepare_command); later
    # runs hit the runner's cache only if the image provides one, so budget for the slow path.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK for the runtime's logging shim
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the build into the iOS shell
        run: npx cap sync ios

      - name: The plugin is registered, not just compiled
        run: |
          set -euo pipefail
          # `cap sync` builds packageClassList by scanning the iOS source of every package in
          # package.json. A plugin that is not in it compiles into the app and is never registered,
          # which presents as "the runtime does not start" with nothing in the log.
          node -e "
            const config = require('./ios/App/App/capacitor.config.json');
            const list = config.packageClassList || [];
            if (!list.includes('MihonRuntimePlugin')) {
              console.error('MihonRuntimePlugin is missing from packageClassList:', list.join(', '));
              process.exit(1);
            }
            console.log('registered plugins:', list.join(', '));
          "

      - name: Install pods (downloads and links the embedded JVM)
        working-directory: ios/App
        run: pod install --repo-update

      - name: Archive without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: The runtime is inside the app, not just linked
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          # A framework that is on disk but not embedded, or a jar that no resource bundle copied,
          # produces an app that starts and then cannot open a single source. Check the bytes.
          test -f "$APP/Frameworks/OpenJDKRuntime.framework/OpenJDKRuntime"
          test -f "$APP/Frameworks/OpenJDKRuntime.framework/lib/lib/modules"
          JAR=$(find "$APP" -name 'MExtensionServer.jar' -print -quit)
          test -n "$JAR"
          test -f "$(dirname "$JAR")/java-logging-shim.jar"
          file "$APP/Frameworks/OpenJDKRuntime.framework/OpenJDKRuntime"
          du -sh "$APP/Frameworks/OpenJDKRuntime.framework" "$(dirname "$JAR")"
          echo "runtime jar: $JAR"

      - name: Pack the IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # A payload-only zip is what an IPA is; no signature means any sideloading tool can sign it.
          cd "$RUNNER_TEMP"
          zip -qry HardlyTracking-unsigned.ipa Payload
          ls -lh HardlyTracking-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HardlyTracking-unsigned-ipa
          path: ${{ runner.temp }}/HardlyTracking-unsigned.ipa
          if-no-files-found: error
